[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvd-iso-rippr"
version = "0.1.0"
description = "interactive dvd image to H.264/AAC mp4 converter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
dvd-ripper = "dvd_ripper.cli:main"

[tool.setuptools.packages.find]
include = ["dvd_ripper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
